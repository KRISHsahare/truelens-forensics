[project]
name = "truelens-backend"
version = "1.0.0"
description = "TrueLens image-forensics API: classical forensics + calibrated deep detectors"
requires-python = ">=3.11,<3.14"
readme = "README.md"

dependencies = [
    # --- web layer ---
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.32,<0.35",
    "python-multipart>=0.0.12",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "slowapi>=0.1.9",
    "orjson>=3.10",

    # --- imaging / numerics ---
    "numpy>=1.26,<2.3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10.4,<12",
    "scipy>=1.13,<2",

    # --- ml ---
    "torch>=2.4,<2.7",
    "torchvision>=0.19,<0.22",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",

    # --- provenance / reporting ---
    # 0.38.1 dropped Windows wheels and 0.38.2 dropped Linux too (macOS-only release).
    # 0.38.0 is the newest with abi3 wheels for both win_amd64 and manylinux.
    "c2pa-python>=0.30,<=0.38.0",
    "reportlab>=4.2,<6",

    # --- misc ---
    "uuid-utils>=0.9",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<7",
    "httpx>=0.27,<1",
    "fakeredis>=2.26,<3",
    "ruff>=0.7",
]
redis = ["redis>=5.2,<7"]
clip = ["open-clip-torch>=2.26,<3"]

[tool.uv]
# CPU-only torch wheels: keeps the Docker image ~900 MB instead of ~6 GB.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "pool: exercises the real spawn ProcessPoolExecutor (slow; run explicitly in CI)",
    "slow: long-running training/calibration smoke tests",
]
filterwarnings = ["ignore::DeprecationWarning:torchvision.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
